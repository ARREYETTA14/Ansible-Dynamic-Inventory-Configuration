# steps to accomplish this task

1. Start 3 instances, label one as "Ansible_control", and the other two as "worker_node_1" and "worker_node_2" respectively, preferably t3.medium
2. Log into the Ansible node and the other nodes, then run the following commands:

# login as root user (works for 2023)
* sudo su -   (You must not switch to root; even ec2-user can handle everything)

# change the name of the servers (works for 2023)
* nano /etc/hostname or sudo hostnamectl set-hostname <name> # label the nodes accordingly "ansible_control", "worker_node_1" 
* reboot # reboots the servers 

# create a common user across the nodes (works for 2023)
* useradd ansible
* passwd ansible # pass a password
* sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/g' /etc/ssh/sshd_config - (Do this manually cause sometimes, the one-line command doesn't work) # change password authentication permission to "yes"
* Uncomment "PermitRootLogin" in the /etc/ssh/sshd_config directory  ____ (step not necessary)
* sudo systemctl restart sshd # Restart sshd service
* Add Ansible to the sudoers group in the directory /etc/sudoers using nano /etc/sudoers by adding *Ansible user to the %wheel group*. Then, fit the Ansible user in the line that says "root user runs commands anywhere". Under the part that talks about adding a user to a %wheel for "NOPASSWD", add the user there as well, such that when the user runs commands using sudo, they won't be asked to pass a password for the command to be executed.
* Once you are done doing all these in all 3 nodes, try SSH into the workernodes via the ansible user in the control node by using
This command "ssh ansible@privateIP"- first, switch to the ansible user "sudo su ansible"

# Create a keypair in the Ansible control node and copy it to the worker nodes - Allows authentication without a password (works for 2023 with a few changes)
* while in the control node, switch to the ansible user, then home directory using 
sudo su ansible 
cd ~
* ssh-keygen -t rsa # generate keypair
* sudo chmod 700 /home/ansible/.ssh # gives the ansible user rwx permissions over the .ssh file 
* ssh-copy-id ansible@private_ip # Copies the public keypair to the workernodes. Do this for all worker nodes
* Try ssh ansible@private_ip # checks if you can ssh to worker nodes without a password
* sudo dnf install -y ansible-core # for Amazon 2023
* ansible --version # check if ansible is installed

### Create an inventory file called hosts in the /etc/ansible directory of root and put the following code
[webservers]
172.31.11.72 ## pass the private or public IP of worker node(s)

[webservers:vars]
ansible_user=ansible
ansible_ssh_private_key_file=/home/ansible/.ssh/id_rsa # make sure it is in the same directory where your keypair was generated

### switch as the ansible user at the home directory and ping the webserver
ansible all -m ping

# install Docker in worker nodes - you log in to the worker nodes via the Ansible control node 
#* sudo amazon-linux-extras install docker -y # install Docker
* sudo dnf install -y docker # Amazon Linux 2023

* sudo service docker start # start docker
* sudo systemctl start docker # start Docker for Amazon Linux 2023

* sudo systemctl enable docker # enable docker
* sudo systemctl status docker # ensure docker runs
* sudo docker run hello-world # verify if docker is install

### In control, update pip and ansible dependencies
sudo dnf install python3-pip -y
pip3 install --upgrade pip setuptools wheel

